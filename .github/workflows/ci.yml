name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]   # supported stacks: py3.11 → NumPy 2.4.x, py3.12 → NumPy 2.5.x (see requirements/)
    env:
      # GitHub's x86_64 runner pool mixes AMD (Zen) and Intel (some with AVX-512 → SkylakeX) CPUs, and OpenBLAS
      # picks a kernel per CPU. The kernel changes the floating-point result of model training, so it is pinned
      # to make CI independent of the runner's CPU. See docs/regression-analysis-mlb-reg-002.md.
      OPENBLAS_CORETYPE: Haswell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - name: Install locked dependencies (hash-checked) and the project
        run: |
          pip install --require-hashes -r requirements/ci-py${{ matrix.python }}.txt
          pip install --no-deps -e .
      - name: Numerical environment
        run: python -m mlbreak env
      - name: Tests
        run: pytest
      - name: Security regression gate
        if: ${{ !cancelled() }}   # report the gate even when a test failed
        run: python -m mlbreak verify
      - name: Demo (all labs, replay + integrity)
        if: ${{ !cancelled() }}
        run: python -m mlbreak demo --lab all
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci && npm run build
        working-directory: frontend
  docker:
    # Builds the shipped image (hash-pinned runtime deps, bundled corpus, built UI) and smoke-tests it running
    # with the same hardening as compose.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mlbreak:ci .
      - name: Start hardened container
        run: >
          docker run -d --name mlbreak -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --tmpfs /data:uid=10001
          --cap-drop ALL --security-opt no-new-privileges:true mlbreak:ci
      - name: Smoke test (health, UI, bundled spam model, ML03 inversion experiment + budgeted attack session)
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8000/lab/ml01/spam/baseline
          curl -sf -o /dev/null http://127.0.0.1:8000/lab/ml03/baseline
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"text": "WINNER! Claim your prize, call 09061701461"}' \
            http://127.0.0.1:8000/api/text/classify | grep -q '"label"'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"targets": {"max_targets": 3}}' \
            http://127.0.0.1:8000/api/inversion/targets | grep -q '"value":"hidden"'
          ID=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"targets": {"max_targets": 20}}' \
            http://127.0.0.1:8000/api/experiments/inversion/attack | python3 -c 'import json,sys; print(json.load(sys.stdin)["experiment_id"])')
          curl -sf http://127.0.0.1:8000/api/experiments/$ID/verify | grep -q '"ok":true'
          SID=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"targets": {"max_targets": 2}, "query_budget_per_target": 1}' http://127.0.0.1:8000/api/inversion/sessions \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_id"])')
          T=$(curl -sf http://127.0.0.1:8000/api/inversion/sessions/$SID | python3 -c 'import json,sys; print(json.load(sys.stdin)["targets"][0]["target_index"])')
          curl -sf -X POST -H 'Content-Type: application/json' -d "{\"target_index\": $T, \"candidate\": 1}" \
            http://127.0.0.1:8000/api/inversion/sessions/$SID/query | grep -q '"query_number":1'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d "{\"target_index\": $T, \"candidate\": 0}" http://127.0.0.1:8000/api/inversion/sessions/$SID/query)
          test "$CODE" = 403   # per-target budget of 1 exhausted
      - name: Container logs
        if: ${{ always() }}
        run: docker logs mlbreak || true
